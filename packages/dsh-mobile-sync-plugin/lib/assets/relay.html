<meta name="apple-mobile-web-app-title" content="DSH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  /* 卡通马卡龙色系：淡黄背景 + 淡蓝主色 + 淡粉渐变 */
  --bg:#fdf6e8;           /* 奶油淡黄背景 */
  --bg2:#fffdf7;          /* 卡片暖白 */
  --bg3:#f6eeda;          /* 淡黄灰（次级背景） */
  --surface:#ffffff;
  --border:rgba(170,140,105,.16);   /* 暖棕细边框 */
  --border2:rgba(170,140,105,.30);
  --text:#504763;         /* 暖灰紫文字 */
  --muted:#9388a4;
  --accent:#7fb5ff;       /* 淡蓝 */
  --accent2:#ff9db9;      /* 淡粉 */
  --accent-soft:rgba(127,181,255,.16);
  --pink-soft:rgba(255,157,185,.16);
  --yellow-soft:rgba(255,217,122,.20);
  --ok:#6ec99a; --ok-soft:rgba(110,201,154,.16);
  --warn:#f0b45c; --warn-soft:rgba(240,180,92,.22);
  --err:#ff8a95; --err-soft:rgba(255,138,149,.16);
  --bubble-user:linear-gradient(135deg,#8cc0ff,#ffa7c2);  /* 蓝→粉渐变气泡 */
  --bubble-bot:#fffdf6;
  --shadow:0 8px 24px rgba(165,135,95,.14);
  --ring:rgba(127,181,255,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;overflow:hidden}
body{background:
  radial-gradient(640px 320px at 92% -4%, var(--blue-soft,var(--accent-soft)), transparent 62%),
  radial-gradient(520px 300px at -4% 18%, var(--pink-soft), transparent 62%),
  radial-gradient(680px 420px at 50% 118%, var(--yellow-soft), transparent 66%),
  var(--bg)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:11px 14px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--ring)}
a{color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* app shell */
/* 背景卡通角色装饰（原创可爱风，半透明、不拦截点击） */
.bg-mascots{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-mascots .mascot{position:absolute;opacity:.38;filter:saturate(1.05);transition:opacity .3s}
.bg-mascots .mascot svg{width:100%;height:auto;display:block}
.bg-mascots .m1{width:150px;left:4%;bottom:10%}
.bg-mascots .m2{width:120px;right:6%;top:16%;transform:rotate(-6deg)}
.bg-mascots .m3{width:140px;right:22%;bottom:3%}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;z-index:1;background:transparent}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;position:sticky;top:0;z-index:5;background:var(--bg2);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.topbar .back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;color:var(--text);transition:background .12s}
.topbar .back:active{background:var(--bg3)}
.topbar .back svg{width:20px;height:20px}
.topbar h1{font-size:16px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.topbar .tbtn{font-size:13px;font-weight:600;color:var(--accent);padding:7px 12px;border-radius:10px;background:var(--accent-soft);transition:transform .1s}
.topbar .tbtn:active{transform:scale(.95)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.tabbar{display:flex;background:var(--bg2);background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:4px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;padding:7px 0 8px;font-size:10.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;transition:color .15s,background .15s}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
.tabbar .ico{display:flex;line-height:1}
.tabbar .ico svg{display:block}

/* login */
#login{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;padding:28px;max-width:420px;margin:0 auto;width:100%}
#login .logo{font-size:40px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px;letter-spacing:1px}
#login .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
#login .field{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
#login label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
#login input{margin-bottom:10px}
#login input:last-of-type{margin-bottom:0}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:14px;padding:12px;font-weight:700;text-align:center;letter-spacing:.5px;box-shadow:0 6px 18px var(--ring);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.97);box-shadow:0 3px 10px var(--ring)}
.btn.sec{background:var(--bg3);color:var(--text);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--border);box-shadow:none;color:var(--text)}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 12px 10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .12s,background .12s}
.row:active{transform:scale(.98);background:var(--bg3)}
.row .ttl{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.row .meta{font-size:11px;color:var(--muted);margin-top:1px}
.row .arrow{color:var(--muted);font-size:18px}
.badge{font-size:10px;padding:2.5px 8px;border-radius:999px;background:var(--bg3);color:var(--muted);font-weight:600}
.badge.run{background:var(--ok-soft);color:var(--ok)}
.badge.pend{background:var(--warn-soft);color:var(--warn)}
.grp{font-size:11px;font-weight:700;color:var(--muted);padding:14px 20px 6px;text-transform:uppercase;letter-spacing:1px}

/* chat */
.chat{padding:12px 12px 18px}
.msg{margin-bottom:14px;animation:msgIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .role{font-size:10.5px;color:var(--muted);margin:0 4px 4px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.bubble{background:var(--bubble-bot);border:1px solid var(--border);border-radius:16px;border-top-left-radius:5px;padding:11px 14px;white-space:pre-wrap;word-break:break-word;max-width:92%;font-size:14.5px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.msg .bubble{margin-right:auto}
.bubble.user{background:var(--bubble-user);color:#fff;border:none;border-radius:16px;border-top-right-radius:5px;margin-left:auto;max-width:82%}
.bubble pre{background:#0a0e14;color:#c8d3e8;border-radius:12px;padding:12px;overflow-x:auto;margin:8px 0;font-size:12.5px;line-height:1.5}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:rgba(127,127,127,.14);padding:1.5px 5px;border-radius:5px}
.bubble.user code{background:rgba(255,255,255,.18)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble strong{font-weight:700}
.bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
.bubble a{color:var(--accent)}.bubble.user a{color:#fff;text-decoration:underline}
.think{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent2);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:7px 12px;margin:8px 0}
.toolcard{border:1px solid var(--border);border-radius:14px;margin:10px 0;overflow:hidden;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.06);animation:msgIn .22s ease-out}
.toolcard .tc-head{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg3)}
.toolcard .tc-name{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolcard .tc-st{font-size:11px;font-weight:600;color:var(--muted);margin-left:auto;flex-shrink:0}
.toolcard .tc-st.done{color:var(--ok)}.toolcard .tc-st.fail{color:var(--err)}
.toolcard .tc-body{padding:10px 12px;font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted);border-top:1px solid var(--border);background:rgba(160,120,70,.06)}
.stream-cur{display:inline-block;width:7px;height:14px;background:var(--accent);border-radius:2px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* approval/question cards */
.pending{border:1px solid var(--warn);border-radius:16px;margin:12px 0;background:linear-gradient(180deg,var(--warn-soft),transparent 55%),var(--surface);padding:14px;box-shadow:var(--shadow);animation:msgIn .25s ease-out}
.pending .pt{font-size:13px;font-weight:800;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.pending .pr{font-size:13.5px;color:var(--text);margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.pending .pr b{color:var(--warn)}
.pending .acts{display:flex;gap:10px}
.pending .acts button{flex:1;padding:11px;border-radius:12px;font-weight:700;font-size:13.5px;letter-spacing:1px;transition:transform .1s}
.pending .acts button:active{transform:scale(.96)}
.pending .allow{background:var(--ok);color:#fff;box-shadow:0 4px 12px var(--ok-soft)}
.pending .deny{background:var(--err);color:#fff;box-shadow:0 4px 12px var(--err-soft)}
.qopt{display:block;width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:12px;margin-bottom:8px;font-size:13.5px;background:var(--bg2);text-align:left;transition:border-color .12s,background .12s}
.qopt:active{border-color:var(--accent);background:var(--accent-soft)}

/* composer */
.composer{display:flex;gap:9px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:var(--bg2);background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);align-items:flex-end}
.composer textarea{resize:none;max-height:130px;min-height:42px;font-size:15px;line-height:1.45;padding:11px 16px;border-radius:21px;flex:1}
.composer .send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px var(--ring);transition:transform .12s}
.composer .send:active{transform:scale(.9)}
.composer .send svg{width:19px;height:19px}
.chips{display:flex;gap:8px;padding:6px 12px 4px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--bg3);color:var(--muted);border:1px solid var(--border);display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.chip:active{transform:scale(.95)}
.chip.act{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* sheet (model picker) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:74vh;overflow-y:auto;padding:6px 0 calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:sheetUp .24s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet::before{content:'';display:block;width:36px;height:4px;border-radius:99px;background:var(--border2);margin:8px auto 4px}
.sheet h3{padding:10px 18px 12px;margin:0;font-size:15px;font-weight:700}
.sheet .grp{font-size:11px;font-weight:700;color:var(--muted);padding:10px 18px 4px;text-transform:uppercase;letter-spacing:1px}
.sheet .opt{padding:12px 18px;display:flex;align-items:center;gap:10px;transition:background .1s}
.sheet .opt:active{background:var(--bg3)}
.sheet .opt.cur{color:var(--accent);background:var(--accent-soft)}
.sheet .opt.cur .nm{font-weight:700}
.sheet .opt .nm{font-weight:500;flex:1}
.sheet .opt .id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.sheet .opt.cur::after{content:'✓';margin-left:auto;font-weight:700}

/* terminal/files views */
.term-out{font-family:ui-monospace,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;padding:14px;background:#0a0e14;color:#c8d3e8;min-height:140px;border-radius:14px;margin:12px;border:1px solid var(--border);line-height:1.55}
.file-item{display:flex;align-items:center;gap:12px;padding:13px 16px;margin:0 12px 8px;background:var(--surface);border:1px solid var(--border);border-radius:13px;transition:transform .1s,background .1s}
.file-item:active{transform:scale(.98);background:var(--bg3)}
.file-item .ic{font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:9px;flex-shrink:0}
.file-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500}
.code-view{font-family:ui-monospace,monospace;font-size:12.5px;white-space:pre;padding:14px;overflow-x:auto;background:#0a0e14;color:#c8d3e8;margin:12px;border-radius:14px;border:1px solid var(--border);line-height:1.55}
.empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:13.5px}
.empty::before{content:'📭';display:block;font-size:38px;margin-bottom:10px;opacity:.7}
.conn-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:all .2s}
.conn-dot.sse{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn-dot.poll{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.conn-dot.off{background:var(--muted)}
/* PC 端同步提示条（双向同步） */
.pcbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);cursor:pointer;flex-shrink:0;transition:background .12s}
.pcbar:active{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.pcbar b{color:var(--accent);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcbar .go{margin-left:auto;color:var(--accent);font-weight:600;flex-shrink:0}
</style>
</head>

<div id="app"></div>

<script>
// ============ 配置 & 状态 ============
const LS = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem('dsh_'+k))??d}catch{return d}},
  set:(k,v)=>localStorage.setItem('dsh_'+k,JSON.stringify(v)),
};
let state = {
  base: LS.get('base',''),
  token: LS.get('token',''),
  ready: false,        // 已确认可访问（插件 Cookie 模式自动探测通过 / 独立中继登录成功）
  view: 'chat',
  workspace: null,
  session: null,       // {sessionId, title}
  models: [],
  model: null,
  events: [],          // 当前会话事件
  lastSeq: 0,
  sse: null,           // EventSource
  messages: [],        // 渲染用消息
  pending: [],         // 待审批/提问
  toolCards: new Map(),// callId -> card element
  pcState: null,       // PC 端同步状态（来自 /m/api/sync）
  syncES: null,        // 同步状态 EventSource
};
const app = document.getElementById('app');

// ============ API ============
// 双模式：独立中继填 base+token（Bearer/query 鉴权）；插件模式 base 为空用相对路径（Cookie 鉴权）
// 插件模式下所有手机 API 都在 /m/api/* 前缀下，这里统一补前缀
function mobilePath(path){
  if(state.base) return path;                          // 独立中继模式：路径原样
  if(path.startsWith('/m/')) return path;              // 已带 /m（如 /m/api/sync）
  if(path.startsWith('/api/')) return '/m'+path;       // /api/x → /m/api/x
  return path;
}
async function api(path, opts={}) {
  const headers = {'content-type':'application/json', ...(state.token?{authorization:'Bearer '+state.token}:{})};
  const url = state.base ? state.base.replace(/\/+$/,'')+path : mobilePath(path);
  const r = await fetch(url, {...opts, headers});
  if(!r.ok && r.status===401) { alert('token 无效或已过期'); return null; }
  const j = await r.json().catch(()=>({error:'非 JSON 响应'}));
  if(j.error) throw new Error(j.error);
  return j;
}
function sseUrl(path){
  const p=mobilePath(path);
  const b=state.base ? state.base.replace(/\/+$/,'') : '';
  const sep=p.includes('?')?'&':'?';
  // 独立中继模式：SSE 无法带自定义 header，token 走查询参数；插件模式靠同源 Cookie
  return state.token ? b+p+sep+'token='+encodeURIComponent(state.token) : b+p;
}

// ============ 双向同步（PC ↔ 手机 UI 状态镜像）============
// 手机端状态上报：切换会话 / 切模型 / 切权限 / 发消息时调用，host 再广播给 PC 端
function reportMobileState(patch){
  if(!state.ready) return;
  try{
    const url=state.base ? state.base.replace(/\/+$/,'')+'/m/api/sync/mobile-state' : '/m/api/sync/mobile-state';
    fetch(url,{
      method:'POST',
      headers:{'content-type':'application/json', ...(state.token?{authorization:'Bearer '+state.token}:{})},
      body:JSON.stringify(patch),
    }).catch(()=>{});
  }catch{ /* ignore */ }
}
// 上报当前打开的会话（切换/新建/退出会话时）
function reportActiveSession(){
  if(!state.session){ reportMobileState({activeSessionId:null,activeSessionTitle:null}); return; }
  reportMobileState({activeSessionId:state.session.sessionId, activeSessionTitle:state.session.title||null});
}
// 订阅 PC 端状态流（/m/api/sync SSE；SSE 被阻断时降级为 30s 轮询）
function startSync(){
  if(!state.ready) return;
  if(state.syncES){ state.syncES.close(); state.syncES=null; }
  let es=null;
  try{ es=new EventSource(sseUrl('/m/api/sync')); }catch{ es=null; }
  if(es){
    es.addEventListener('state',(e)=>{
      try{ const s=JSON.parse(e.data); state.pcState=s.pc||null; renderPcBar(); }catch{}
    });
    es.onerror=()=>{ /* 自动重连 */ };
    state.syncES=es;
  }
  // 兜底轮询：SSE 不可用时也能拿到 PC 状态
  if(state.syncPollTimer) clearInterval(state.syncPollTimer);
  state.syncPollTimer=setInterval(async()=>{
    try{
      const j=await api('/m/api/sync/state');
      if(j && j.pc){ state.pcState=j.pc; renderPcBar(); }
    }catch{ /* 单次失败跳过 */ }
  },30000);
}
function stopSync(){
  if(state.syncES){ state.syncES.close(); state.syncES=null; }
  if(state.syncPollTimer){ clearInterval(state.syncPollTimer); state.syncPollTimer=null; }
}
// PC 端当前会话提示条（渲染进列表/聊天视图，可点击跳转）
function pcBarHtml(){
  const p=state.pcState;
  if(!p||!p.activeSessionId) return '';
  const t=p.activeSessionTitle||p.activeSessionId.slice(0,8);
  return `<div class="pcbar" id="pcBar"><span>💻 电脑正在查看：</span><b>${esc(t)}</b><span class="go">点击切换 ›</span></div>`;
}
function bindPcBar(){
  const el=document.getElementById('pcBar');
  if(!el) return;
  el.onclick=openPcSession;
}
// 在手机上打开 PC 端正在查看的会话
function openPcSession(){
  const p=state.pcState;
  if(!p||!p.activeSessionId) return;
  stopStream();
  state.session={sessionId:p.activeSessionId,title:p.activeSessionTitle||'会话'};
  state.messages=[];state.lastSeq=0;state.events=[];state.toolCards.clear();
  loadHistory().then(()=>{ state.view='chat'; render(); });
  reportActiveSession();
}

// ============ 极简 Markdown 渲染 ============
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(text){
  if(!text) return '';
  let t = esc(text);
  // code blocks
  t = t.replace(/```([\s\S]*?)```/g, (_,c)=>`\n<pre><code>${c.replace(/^\n/,'')}</code></pre>\n`);
  // inline code
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // bold/italic
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  // headers
  t = t.replace(/^###\s+(.+)$/gm,'<p style="font-weight:600">$1</p>')
       .replace(/^##\s+(.+)$/gm,'<p style="font-weight:600;font-size:16px">$1</p>');
  // links
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  // lists
  t = t.replace(/^[\-\*]\s+(.+)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  // paragraphs
  t = t.split(/\n{2,}/).map(b=>/^<(pre|ul|p)/.test(b.trim())?b:`<p>${b.replace(/\n/g,'<br>')}</p>`).join('');
  return t;
}

// ============ 视图渲染 ============
function render(){
  if(!state.ready) return viewLogin();
  if(state.view==='files') return viewFiles('');
  if(state.view==='terminal') return viewTerminal();
  if(!state.session) return viewSessions();
  return viewChat();
}

// ---- 登录 ----
function viewLogin(){
  app.innerHTML = `
  <div id="login">
    <div class="logo">DSH</div>
    <div class="sub">手机远程控制你的电脑 Agent</div>
    <div class="field">
      <label>服务器地址</label>
      <input id="inBase" placeholder="http://192.168.x.x:8788 或留空（插件模式）" value="${esc(state.base)}">
      <label>访问令牌 Token</label>
      <input id="inToken" placeholder="独立中继模式需要；插件模式留空" value="${esc(state.token)}">
    </div>
    <button class="btn" id="btnConn">连 接</button>
    <div class="sub" id="loginHint">检测中…</div>
  </div>`;
  // 自动探测：插件模式（同源 + 已配对 Cookie）→ 直接进入移动端
  probePluginMode();
  document.getElementById('btnConn').onclick=async()=>{
    const b=document.getElementById('inBase').value.trim().replace(/\/+$/,'');
    const t=document.getElementById('inToken').value.trim();
    state.base=b;state.token=t;
    if(!b){
      // 插件模式：相对路径 + Cookie 鉴权
      try{
        const j=await api('/m/api/workspaces');
        if(j===null){ return; }
        state.ready=true;LS.set('base','');LS.set('token','');state.view='chat';render();startSync();
      }catch(e){ alert('连接失败：'+e.message+'（插件模式请先扫码配对）'); }
      return;
    }
    if(!b){alert('请填写服务器地址');return}
    LS.set('base',b);LS.set('token',t);
    try{ const h=await api('/health'); if(h){ state.ready=true; state.view='chat'; render(); startSync(); } }
    catch(e){ alert('连接失败：'+e.message); }
  };
}

// 插件模式探测：同源 /m/api/workspaces 返回 200 = 已配对（Cookie 有效），跳过登录
async function probePluginMode(){
  const hint=document.getElementById('loginHint');
  try{
    const r=await fetch('/m/api/workspaces',{headers:{'content-type':'application/json'}});
    if(r.status===200){
      state.base='';state.token='';state.ready=true;
      LS.set('base','');LS.set('token','');
      state.view='chat';render();startSync();
    }else if(hint){
      hint.textContent='未检测到配对（插件模式需先扫码配对，或填独立中继地址+token）';
    }
  }catch(e){
    if(hint) hint.textContent='未检测到本地服务（插件模式）或未填独立中继地址';
  }
}

// ---- 会话/工作区列表 ----
async function viewSessions(){
  app.innerHTML=`<div class="topbar"><h1>会话</h1><button class="tbtn" id="newS">＋ 新建</button></div>${pcBarHtml()}<div class="content" id="lst"><div class="empty">加载中…</div></div>`;
  bindPcBar();
  document.getElementById('newS').onclick=async()=>{
    try{ const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({cwd:state.workspace||''})});
      state.session={sessionId:r.sessionId,title:'新会话'}; state.messages=[];state.lastSeq=0;state.events=[];render();
      reportActiveSession();
    }catch(e){alert('新建失败：'+e.message)}
  };
  const lst=document.getElementById('lst');
  try{
    const {items:ws}=await api('/api/workspaces');
    const {items:ss}=await api('/api/sessions');
    let html='';
    if(ws.length){
      html+=ws.map(w=>`<div class="row" data-ws="${w.workspaceId}"><span class="badge">${w.sessionCount}</span><div class="ttl">${esc(w.title||w.path)}</div><div class="meta mono">${esc(w.path)}</div><span class="arrow">›</span></div>`).join('');
    }
    if(ss.length){
      html+=`<div class="grp">所有会话</div>`;
      html+=ss.map(s=>`<div class="row" data-sid="${s.sessionId}"><div class="ttl">${esc(s.title||'(未命名)')}${s.running?'<span class="badge run" style="margin-left:7px">运行中</span>':''}</div><div class="meta">${esc((s.cwd||'').split(/[\\/]/).pop())}</div><span class="arrow">›</span></div>`).join('');
    }
    lst.innerHTML=html||'<div class="empty">暂无会话，点 + 新建</div>';
    lst.querySelectorAll('[data-sid]').forEach(el=>el.onclick=async()=>{
      state.session={sessionId:el.dataset.sid,title:el.querySelector('.ttl').textContent};
      state.messages=[];state.lastSeq=0;state.events=[];state.toolCards.clear();
      await loadHistory(); render();
      reportActiveSession();
    });
  }catch(e){ lst.innerHTML=`<div class="empty">加载失败：${esc(e.message)}<br>请确认 dsh web 已运行</div>`; }
  bindTabbar();
}

// ---- 加载历史 ----
async function loadHistory(){
  try{
    const r=await api('/api/sessions/'+state.session.sessionId+'/history');
    state.messages=r.messages||[];
  }catch(e){ state.messages=[{role:'assistant',text:'⚠ 无法加载历史：'+e.message}]; }
}

// ---- 聊天视图 ----
function viewChat(){
  app.innerHTML=`
  <div class="topbar">
    <button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="conn-dot sse" id="connDot" title="实时 SSE"></span>
    <h1>${esc(state.session?.title||'对话')}</h1>
    <button class="tbtn" id="mdl">模型</button>
  </div>
  ${pcBarHtml()}
  <div class="content chat" id="chat"></div>
  <div class="chips">
    <span class="chip" id="permChip">🔐 权限</span>
    <span class="chip" id="modelChip">🧠 ${state.model?esc(state.model):'默认模型'}</span>
    <span class="chip" id="filesChip">📁 文件</span>
  </div>
  <div class="composer">
    <textarea id="ta" placeholder="输入指令，Enter 发送" rows="1"></textarea>
    <button class="send" id="snd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>`;
  bindPcBar();
  document.getElementById('bk').onclick=()=>{stopStream();state.session=null;render();reportActiveSession()};
  document.getElementById('mdl').onclick=openModelSheet;
  document.getElementById('modelChip').onclick=openModelSheet;
  document.getElementById('permChip').onclick=openPermSheet;
  document.getElementById('filesChip').onclick=()=>{state.view='files';render()};
  const ta=document.getElementById('ta'),snd=document.getElementById('snd');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  snd.onclick=send;
  renderChat();
  startStream();
}
function renderChat(){
  const c=document.getElementById('chat'); if(!c) return;
  c.innerHTML='';
  for(const m of state.messages){
    if(m.role==='tool'||m.role==='tool-result'){ appendToolCard(m); continue; }
    const div=document.createElement('div');div.className='msg';
    div.innerHTML=`<div class="role">${m.role==='user'?'你':'Agent'}</div><div class="bubble ${m.role==='user'?'user':''}">${md(m.text||'')}</div>`;
    c.appendChild(div);
  }
  // 渲染待审批/提问
  for(const p of state.pending) appendPending(p);
  c.scrollTop=c.scrollHeight;
}

// ---- 工具卡片 ----
function appendToolCard(m){
  const c=document.getElementById('chat'); if(!c) return;
  const callId=m.callId||('r'+Date.now());
  let card=state.toolCards.get(callId);
  if(!card){
    card=document.createElement('div');card.className='toolcard';
    card.innerHTML=`<div class="tc-head"><span class="tc-name">🔧 ${esc(m.text)}</span><span class="tc-st">执行中…</span></div><div class="tc-body" style="display:none"></div>`;
    c.appendChild(card);state.toolCards.set(callId,card);
  }
  const body=card.querySelector('.tc-body');
  let detail='';
  if(m.argsSummary) detail+='参数: '+m.argsSummary+'\n';
  if(m.result!==undefined) detail+=m.result;
  if(detail){ body.textContent=detail;body.style.display='block'; }
  const st=card.querySelector('.tc-st');
  if(m.result!==undefined){ st.textContent=m.isError?'失败':'完成';st.className='tc-st '+(m.isError?'fail':'done'); }
  else { st.textContent='执行中…';st.className='tc-st'; }
  card.onclick=()=>{body.style.display=body.style.display==='none'?'block':'none'};
  c.scrollTop=c.scrollHeight;
}

// ---- 审批/提问卡片 ----
function appendPending(p){
  const c=document.getElementById('chat'); if(!c) return;
  if(document.getElementById('p_'+(p.key||p.approvalId))) return;
  const div=document.createElement('div');div.className='pending';div.id='p_'+(p.key||p.approvalId);
  if(p.kind==='question'){
    let opts='';
    for(const q of p.questions||[]){
      opts+=`<div style="margin-bottom:8px"><div style="font-weight:600;margin-bottom:4px">${esc(q.question||q.text||'')}</div>`;
      for(const o of (q.options||[])) opts+=`<button class="qopt" data-q="${esc(q.id)}" data-o="${esc(o.id)}">${esc(o.label||o.text||o.id)}</button>`;
      opts+='</div>';
    }
    opts+=`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sec" id="qskip">跳过</button></div>`;
    div.innerHTML=`<div class="pt">❓ Agent 提问</div>${opts}`;
    c.appendChild(div);
    div.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>answerQuestion(p.rpcId,b.dataset.q,b.dataset.o));
    document.getElementById('qskip').onclick=()=>answerQuestion(p.rpcId,null,null);
  }else{
    div.innerHTML=`<div class="pt">🛡 需要授权</div><div class="pr"><b>${esc(p.toolName||'操作')}</b>${p.reason?'\n'+esc(p.reason):''}</div><div class="acts"><button class="deny">拒绝</button><button class="allow">允许</button></div>`;
    c.appendChild(div);
    div.querySelector('.allow').onclick=()=>respondApproval(p.approvalId,'allowed-once');
    div.querySelector('.deny').onclick=()=>respondApproval(p.approvalId,'rejected');
  }
  c.scrollTop=c.scrollHeight;
}

// ---- 实时事件：SSE 优先 + 轮询降级 ----
// Cloudflare QuickTunnel / 部分反代会阻断 SSE（Server-Sent Events）。
// 检测到 SSE 连接失败后自动切换为轮询模式，保证不同 WiFi / 公网下功能不中断。
state.connMode='sse';  // 'sse' | 'polling' | 'off'
state.pollTimer=null;
state.sseFailCount=0;
const SSE_FAIL_THRESHOLD=3;        // 连续失败 3 次后切轮询
const POLL_INTERVAL_MS=1500;      // 轮询间隔（1.5s）

function setConnMode(mode){
  state.connMode=mode;
  const el=document.getElementById('connDot');
  if(el){
    el.className='conn-dot '+(mode==='sse'?'sse':mode==='polling'?'poll':'off');
    el.title=mode==='sse'?'实时 SSE':mode==='polling'?'轮询模式(隧道/反代降级)':'未连接';
  }
}

function startStream(){
  stopStream();
  if(!state.session) return;
  // 先尝试 SSE
  trySSE();
}
function trySSE(){
  if(!state.session) return;
  // 带 afterSeq：服务端连接建立时先回放断线期间错过的缓冲事件（离线补同步）
  const es=new EventSource(sseUrl('/api/sessions/'+state.session.sessionId+'/events.stream?afterSeq='+state.lastSeq));
  state.sse=es;
  es.addEventListener(state.session.sessionId,(e)=>{
    try{ handleEvent(JSON.parse(e.data)); }catch{}
  });
  es.addEventListener('__pending',async()=>{
    try{ const r=await api('/api/pending'); state.pending=r.items||[]; renderChat(); }catch{}
  });
  es.onopen=()=>{ state.sseFailCount=0; setConnMode('sse'); };
  es.onerror=()=>{
    state.sseFailCount++;
    if(state.sseFailCount>=SSE_FAIL_THRESHOLD && state.connMode!=='polling'){
      // SSE 多次失败 → 关闭并切换到轮询（隧道/反代阻断 SSE 时的降级）
      es.close(); state.sse=null;
      startPolling();
      return;
    }
    // 手动重连：EventSource 自动重连不会携带最新的 afterSeq，丢失离线补同步能力，
    // 因此关闭旧连接并用最新 lastSeq + 退避重建
    if(es.readyState===EventSource.CLOSED || es.readyState===EventSource.CONNECTING){
      const fail=state.sseFailCount;
      es.close(); state.sse=null;
      setTimeout(()=>{
        if(!state.session || state.connMode==='polling') return;
        trySSE();
      }, Math.min(500*fail, 5000));
    }
  };
}
// 轮询模式：定时拉 events 增量 + pending 列表
function startPolling(){
  if(!state.session) return;
  setConnMode('polling');
  const poll=async()=>{
    if(!state.session || state.connMode!=='polling') return;
    try{
      // 拉事件增量
      const r=await api('/api/sessions/'+state.session.sessionId+'/events?afterSeq='+state.lastSeq);
      if(r && r.items){
        for(const it of r.items) handleEvent(it);
      }
      // 拉待审批/提问
      const p=await api('/api/pending');
      const prev=state.pending.length;
      state.pending=(p&&p.items)||[];
      if(prev!==state.pending.length) renderChat();
    }catch{ /* 单次失败跳过 */ }
  };
  poll(); // 立即一次
  state.pollTimer=setInterval(poll, POLL_INTERVAL_MS);
}
function stopStream(){
  if(state.sse){state.sse.close();state.sse=null;}
  if(state.pollTimer){clearInterval(state.pollTimer);state.pollTimer=null;}
  setConnMode('off');
}

function handleEvent(it){
  state.events.push(it); if(it.seq>state.lastSeq) state.lastSeq=it.seq;
  const c=document.getElementById('chat'); if(!c) return;
  if(it.kind==='text'||it.kind==='thinking'){
    // 流式追加到最后一条 assistant 气泡
    let last=state.messages[state.messages.length-1];
    if(!last||last.role!=='assistant'||last._stream!==true){
      last={role:'assistant',text:'',_stream:true};state.messages.push(last);
      const div=document.createElement('div');div.className='msg';div.id='streammsg';
      div.innerHTML=`<div class="role">Agent</div><div class="bubble"></div>`;
      c.appendChild(div);last._el=div.querySelector('.bubble');
    }
    if(it.kind==='thinking'){ last._think=(last._think||'')+it.text; }
    else { last.text+=it.text; }
    if(last._el){
      let html=md(last.text);
      if(last._think) html='<div class="think">'+esc(last._think).slice(0,300)+'…</div>'+html;
      html+='<span class="stream-cur"></span>';
      last._el.innerHTML=html;
    }
    c.scrollTop=c.scrollHeight;
  }else if(it.kind==='tool'||it.kind==='tool-result'){
    appendToolCard({callId:it.callId,text:it.text||'',arguments:it.arguments,argsSummary:it.argsSummary,result:it.result,isError:it.isError});
  }else if(it.kind==='done'){
    const last=state.messages[state.messages.length-1];
    if(last&&last._stream){last._stream=false; if(last._el){const cur=last._el.querySelector('.stream-cur');if(cur)cur.remove();}}
  }else if(it.kind==='usage'){
    // 可显示 token 用量
  }
}

// ---- 发送消息 ----
async function send(){
  const ta=document.getElementById('ta');const text=ta.value.trim();if(!text)return;
  ta.value='';ta.style.height='auto';
  state.messages.push({role:'user',text});
  // 即时渲染用户消息
  const c=document.getElementById('chat');
  const div=document.createElement('div');div.className='msg';
  div.innerHTML=`<div class="role">你</div><div class="bubble user">${md(text)}</div>`;
  c.appendChild(div);c.scrollTop=c.scrollHeight;
  try{ await api('/api/sessions/'+state.session.sessionId+'/prompt',{method:'POST',body:JSON.stringify({text})});
    reportMobileState({action:'发消息'}); }
  catch(e){ state.messages.push({role:'assistant',text:'⚠ 发送失败：'+e.message}); renderChat(); }
}

// ---- 审批/提问应答 ----
async function respondApproval(id,outcome){
  try{ await api('/api/approvals/'+id,{method:'POST',body:JSON.stringify({outcome})});
    document.getElementById('p_'+id)?.remove();
    state.pending=state.pending.filter(p=>p.approvalId!==id);
  }catch(e){alert('操作失败：'+e.message)}
}
async function answerQuestion(rpcId,qId,oId){
  const answers=[{id:qId,selected:oId?[oId]:[]}];
  try{ await api('/api/questions/'+rpcId,{method:'POST',body:JSON.stringify({answer:{answers}})});
    document.getElementById('p_q:'+rpcId)?.remove();
    state.pending=state.pending.filter(p=>p.rpcId!==rpcId);
  }catch(e){alert('回答失败：'+e.message)}
}

// ---- 模型选择面板 ----
async function openModelSheet(){
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h3>选择模型</h3><div id="ml" style="padding:8px 0"><div class="empty">加载中…</div></div></div>`;
  app.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove()};
  const ml=document.getElementById('ml');
  try{
    const r=await api('/api/sessions/'+state.session.sessionId+'/model');
    const items=r.items||r.models||[];
    state.models=items;
    if(!items.length){ml.innerHTML='<div class="empty">无可用模型</div>';return}
    let html='';
    // 按 provider 分组
    const groups={};
    for(const m of items){const p=m.provider||m.group||'其他';(groups[p]=groups[p]||[]).push(m)}
    for(const[g,ms]of Object.entries(groups)){
      html+=`<div class="grp">${esc(g)}</div>`;
      html+=ms.map(m=>{const id=m.id||m.modelId||m.name;const cur=state.model===id?'cur':'';
        return `<div class="opt ${cur}" data-id="${esc(id)}"><span class="nm">${esc(m.name||m.label||id)}</span><span class="id">${esc(id)}</span></div>`}).join('');
    }
    ml.innerHTML=html;
    ml.querySelectorAll('.opt').forEach(o=>o.onclick=async()=>{
      try{await api('/api/sessions/'+state.session.sessionId+'/model',{method:'POST',body:JSON.stringify({model:o.dataset.id})});
        state.model=o.dataset.id;LS.set('model',o.dataset.id);bg.remove();document.getElementById('modelChip').textContent=o.dataset.id;
        reportMobileState({model:o.dataset.id,action:'切换模型 '+o.dataset.id});
      }catch(e){alert('切换失败：'+e.message)}
    });
  }catch(e){ ml.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

// ---- 权限面板 ----
function openPermSheet(){
  const bg=document.createElement('div');bg.className='sheet-bg';
  const modes=[{id:'ask',label:'逐次询问（默认）'},{id:'auto',label:'自动执行'},{id:'read-only',label:'只读模式'},{id:'plan',label:'仅规划'}];
  bg.innerHTML=`<div class="sheet"><h3>权限模式</h3>${modes.map(m=>`<div class="opt" data-m="${m.id}"><span class="nm">${esc(m.label)}</span><span class="id">${m.id}</span></div>`).join('')}</div>`;
  app.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};
  bg.querySelectorAll('.opt').forEach(o=>o.onclick=async()=>{
    try{await api('/api/sessions/'+state.session.sessionId+'/permission',{method:'POST',body:JSON.stringify({mode:o.dataset.m})});
      bg.remove();
      reportMobileState({permission:o.dataset.m,action:'切换权限 '+o.dataset.m});
    }catch(e){alert('设置失败：'+e.message)}
  });
}

// ---- 文件浏览视图 ----
async function viewFiles(dir){
  app.innerHTML=`<div class="topbar"><button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1>文件</h1></div><div class="content" id="fl"><div class="empty">加载中…</div></div>`;
  document.getElementById('bk').onclick=()=>{state.view='chat';render()};
  const fl=document.getElementById('fl');
  try{
    const r=await api('/api/files'+(dir?('?path='+encodeURIComponent(dir)):''));
    let html=`<div class="row" style="font-size:12px;color:var(--muted)">${esc(r.path)}</div>`;
    html+=r.items.map(f=>`<div class="file-item" data-d="${f.dir?'1':'0'}" data-p="${esc(pathJoin(r.path,f.name))}"><span class="ic">${f.dir?'📁':'📄'}</span><span class="nm">${esc(f.name)}</span></div>`).join('');
    fl.innerHTML=html;
    fl.querySelectorAll('.file-item').forEach(el=>el.onclick=()=>{
      if(el.dataset.d==='1') viewFiles(el.dataset.p);
      else viewFile(el.dataset.p);
    });
  }catch(e){ fl.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  bindTabbar(true);
}
async function viewFile(p){
  app.innerHTML=`<div class="topbar"><button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1 style="font-size:13px">${esc(p.split(/[\\/]/).pop())}</h1></div><div class="content" id="fv"><div class="empty">加载中…</div></div>`;
  document.getElementById('bk').onclick=()=>viewFiles(p.split(/[\\/]/).slice(0,-1).join('/')||'');
  try{ const r=await api('/api/file?path='+encodeURIComponent(p));
    document.getElementById('fv').innerHTML=`<pre class="code-view">${esc(r.content)}</pre>`;
  }catch(e){ document.getElementById('fv').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function pathJoin(a,b){return a.replace(/[\\/]+$/,'')+'/'+b}

// ---- 终端视图 ----
function viewTerminal(){
  app.innerHTML=`<div class="topbar"><button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1>终端</h1></div>
  <div class="content"><div class="term-out" id="out">$ 在电脑上执行命令（输出在此显示）</div></div>
  <div class="composer"><input id="cmd" placeholder="输入命令，Enter 执行" style="font-family:ui-monospace,monospace"><button class="send" id="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>`;
  document.getElementById('bk').onclick=()=>{state.view='chat';render()};
  const cmd=document.getElementById('cmd'),out=document.getElementById('out');
  cmd.onkeydown=e=>{if(e.key==='Enter')runCmd()};
  document.getElementById('run').onclick=runCmd;
  async function runCmd(){const c=cmd.value.trim();if(!c)return;cmd.value='';
    out.textContent+='\n$ '+c+'\n';try{const r=await api('/api/terminal',{method:'POST',body:JSON.stringify({command:c})});
      out.textContent+=(r.stdout||'')+(r.stderr?'\n[stderr] '+r.stderr:'')+'\n[exit '+r.exitCode+']';out.scrollTop=out.scrollHeight;}
    catch(e){out.textContent+='\n错误：'+e.message;}
  }
  bindTabbar(true);
}

// ---- 底部导航 ----
const TAB_ICONS = {
  chat: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  files: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  terminal: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
};
function bindTabbar(filesView=false){
  // 仅在会话列表/聊天场景显示底部导航
  if(state.session&&!filesView) return;
  if(state.session||filesView){
    const tb=document.createElement('div');tb.className='tabbar';
    tb.innerHTML=`<button data-v="chat" class="${state.view==='chat'?'on':''}"><span class="ico">${TAB_ICONS.chat}</span>对话</button>
      <button data-v="files" class="${state.view==='files'?'on':''}"><span class="ico">${TAB_ICONS.files}</span>文件</button>
      <button data-v="terminal" class="${state.view==='terminal'?'on':''}"><span class="ico">${TAB_ICONS.terminal}</span>终端</button>`;
    app.appendChild(tb);
    tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()});
  }
}

// ============ 启动 ============
render();

// ============ 前后台切换增强（切回前台立即重连 + 拉最新状态）============
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !state.ready) return;
  if (state.session) {
    if (state.connMode === 'polling') {
      api('/api/sessions/'+state.session.sessionId+'/events?afterSeq='+state.lastSeq).then(r=>{ if(r&&r.items) for(const it of r.items) handleEvent(it); }).catch(()=>{});
    } else {
      stopStream(); startStream();
    }
    api('/api/pending').then(j=>{ state.pending=(j&&j.items)||[]; renderChat(); }).catch(()=>{});
  }
  api('/m/api/sync/state').then(j=>{ if(j&&j.pc){ state.pcState=j.pc; renderPcBar(); } }).catch(()=>{});
});

window.addEventListener('beforeunload',()=>{stopStream();stopSync();});
</script>
